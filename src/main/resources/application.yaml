server:
  port: 8083 

spring:
  application:
    name: backend-usuario

  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:usuario_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: update 
    show-sql: true

 
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

  
  security:
    oauth2:
      resourceserver:
        jwt:
          # Reemplaza con tu Tenant ID real
          issuer-uri: https://login.microsoftonline.com/8ea291c8-4670-4598-8f0f-b5e216b5b755/v2.0
          # Reemplaza con tu Client ID (Audience)
          audiences: c6445b4c-7863-42ac-a620-2fa3b5ea58d8