server:
  port: 8084 # Puerto asignado para Usuarios

spring:
  application:
    name: usuarios
  
  security:
    oauth2:
      resourceserver:
        jwt:
          # URL completa para el autodescubrimiento de Azure
          issuer-uri: https://login.microsoftonline.com/8ea291c8-4670-4598-8f0f-b5e216b5b755/v2.0
          audiences: c6445b4c-7863-42ac-a620-2fa3b5ea58d8
  
  datasource:
    # Conexión a PostgreSQL preparada para AWS
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:usuarios_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    
  rabbitmq:
    # Conexión a RabbitMQ preparada para AWS
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://3.213.91.126}